# Build the standalone vigent binaries (no Node needed), check each on its own
# platform, and attach them to the GitHub release.
#
# Runs on a version tag (with the npm release), by hand from the Actions tab,
# and on pull requests that touch the build. Only a tag publishes.
name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build-binary.mjs
      - scripts/homebrew-formula.mjs
      - install.sh
      - install.ps1
      - docker/**
      - src/standalone.ts
      - test/standalone.test.mjs
      - .github/workflows/binaries.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build every target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: npm ci

      - name: Check the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      # Bun cross-compiles, so one runner builds them all; the sizes are in this step's log
      - name: Build
        run: node scripts/build-binary.mjs --all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist-bin/*.tar.gz
            dist-bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  check:
    name: Check ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-x64-baseline, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-14 }
          # no Intel runner: the x64 build runs under Rosetta
          - { target: darwin-x64, os: macos-14 }
          # no pty on Windows: the version, the commands, riftri and install.ps1 are checked
          - { target: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the test's own tools (the terminal emulator, the compiled helpers); the binary under test doesn't use them
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Unpack
        shell: bash
        run: |
          set -euo pipefail
          cd dist-bin
          grep " vigent-${{ matrix.target }}.tar.gz\$" SHA256SUMS | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
          tar -xzf "vigent-${{ matrix.target }}.tar.gz"
          # the small build for machines with Node, where there is one (not Windows, not baseline)
          if [[ -f "vigent-${{ matrix.target }}-node.tar.gz" ]]; then tar -xzf "vigent-${{ matrix.target }}-node.tar.gz"; fi

      # --version, the commands, riftri beside it, an agent in a worktree with no node on PATH, and the installer
      - name: Test the binary
        shell: bash
        run: |
          set -euo pipefail
          exe=""; [[ "${{ matrix.target }}" == windows-* ]] && exe=".exe"
          VIGENT_BINARY="dist-bin/vigent-${{ matrix.target }}/vigent$exe" node --test test/standalone.test.mjs

      # the same checks on the one-file build, run by this runner's Node
      - name: Test the small build
        if: ${{ !startsWith(matrix.target, 'windows') && !endsWith(matrix.target, '-baseline') }}
        shell: bash
        run: |
          set -euo pipefail
          VIGENT_BINARY="dist-bin/vigent-${{ matrix.target }}-node/vigent.mjs" node --test test/standalone.test.mjs

  check-musl:
    name: Check ${{ matrix.target }} (Alpine)
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64-musl, os: ubuntu-24.04 }
          - { target: linux-arm64-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      # a bare Alpine with git: install.sh picks the musl archive by itself, then vigent and riftri run
      - name: Install and run in Alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3 sh -euc '
            apk add --no-cache git libstdc++ libgcc >/dev/null
            VIGENT_DOWNLOAD_BASE=file:///src/dist-bin sh /src/install.sh 2>&1 | tee /tmp/install.log
            grep -q "downloading vigent-${{ matrix.target }}.tar.gz" /tmp/install.log
            ~/.local/bin/vigent --version
            ~/.local/bin/vigent theme list | grep -q "^tokyonight"
            ~/.vigent/riftri --version
            # with Node there, install.sh switches to the small build
            apk add --no-cache nodejs >/dev/null
            VIGENT_DOWNLOAD_BASE=file:///src/dist-bin sh /src/install.sh 2>&1 | tee /tmp/install.log
            grep -q "downloading vigent-${{ matrix.target }}-node.tar.gz" /tmp/install.log
            ~/.local/bin/vigent --version
          '

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      # the build context: each platform's vigent and riftri under Docker's name for it;
      # amd64 gets the baseline build, so the image also runs on VMs without AVX2
      - name: Lay out the context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p context/amd64 context/arm64 unpacked
          tar -xzf dist-bin/vigent-linux-x64-baseline.tar.gz -C unpacked
          tar -xzf dist-bin/vigent-linux-arm64.tar.gz -C unpacked
          cp unpacked/vigent-linux-x64-baseline/{vigent,riftri} context/amd64/
          cp unpacked/vigent-linux-arm64/{vigent,riftri} context/arm64/

      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner and try it
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load -t vigent:check -f docker/Dockerfile context
          version="$(node -p 'require("./package.json").version')"
          test "$(docker run --rm vigent:check --version)" = "vigent $version"
          docker run --rm vigent:check theme list | grep -q '^tokyonight'
          docker run --rm --entrypoint /opt/vigent/riftri vigent:check --version

  release:
    name: Attach to the release
    if: github.ref_type == 'tag'
    needs: [check, check-musl, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist-bin/*.tar.gz dist-bin/SHA256SUMS --clobber

  # After the release has its archives: a failed push here doesn't hold them back.
  image-push:
    name: Push the container image
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Lay out the context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p context/amd64 context/arm64 unpacked
          tar -xzf dist-bin/vigent-linux-x64-baseline.tar.gz -C unpacked
          tar -xzf dist-bin/vigent-linux-arm64.tar.gz -C unpacked
          cp unpacked/vigent-linux-x64-baseline/{vigent,riftri} context/amd64/
          cp unpacked/vigent-linux-arm64/{vigent,riftri} context/arm64/

      # the arm64 image's apt-get runs emulated
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -f docker/Dockerfile context

  # The repository is its own Homebrew tap: Formula/vigent.rb on the default branch,
  # rewritten for each release with the new archives' checksums.
  homebrew:
    name: Update the Homebrew formula
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Write and commit the formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$(node -p 'require("./package.json").version')" != "$version" ]]; then
            echo "the default branch is no longer at $version; not touching the formula" >&2
            exit 0
          fi
          node scripts/homebrew-formula.mjs Formula/vigent.rb
          ruby -c Formula/vigent.rb
          git add Formula/vigent.rb
          if git diff --cached --quiet; then echo "the formula is already at $version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(homebrew): vigent $version"
          git push
